# Parameters for emap's elevation_mapping_node.
#
# Grouped by which step of the roadmap introduced them (see
# docs/work-docs/emap/IMPLEMENTATION_PLAN.md) so it's obvious where to go
# read the full from-scratch explanation of any one value.
elevation_mapping_node:
  ros__parameters:
    # --- step 3: the map grid itself ---
    resolution: 0.1          # meters per cell
    length: 20.0             # meters per side of the LOCAL rolling map (re-centers on the UAV)
    initial_variance: 10.0   # placeholder uncertainty for a never-observed cell

    # --- persistent global map (see docs/work-docs/emap/step08_persistent_global_map.md) ---
    # A second, larger map, fixed at the world origin forever (never re-centers,
    # never forgets) - this is the one that matters for navigation later, since
    # a path planner needs to remember terrain it can no longer currently see.
    # Shares resolution/initial_variance with the local map above.
    global_map_length: 40.0   # meters per side - generous headroom over our ~20m test worlds

    # --- step 4: Bayesian fusion ---
    sensor_noise_factor: 0.01   # measurement variance = this * range^2
    mahalanobis_thresh: 2.0     # how many "std devs" of disagreement before a point is an outlier
    outlier_variance: 1.0       # how much an outlier bumps a cell's variance by
    min_valid_distance: 0.2     # points closer than this to the sensor are dropped
    # The rgbd_camera sensor's <far> clip in models/iris_quad/model.sdf is
    # 20.0m. Beyond that, most pixels correctly report +inf (already
    # filtered), but a minority instead clamp to a value right at the clip
    # boundary instead of a clean "no return" - observed live at ~19.94m.
    # 19.8 catches that (comfortable margin below the observed ~19.94m
    # artifact) while still keeping genuine readings further out (e.g. a
    # real ~19.5m hit) - NOT the same as the sensor's actual far clip, which
    # would reject nothing. If model.sdf's <far> ever changes, update this
    # too (kept a fixed margin below it, same convention as the hardcoded
    # camera_static_tf offset in uav_sim.launch.py matching model.sdf's <pose>).
    max_valid_range: 19.8

    # --- step 6: this node's own wiring ---
    map_frame: "iris_quad/odom"   # root of the TF tree (step 2) the map lives in
    publish_rate_hz: 2.0           # how often to publish the GridMap message

    # --- step 7: analytical traversability (see emap/traversability.py) ---
    max_slope: 0.35       # rise/run above which a cell is lethal (~20 degrees)
    max_step: 0.15        # meters of height jump in a 3x3 neighborhood above which a cell is lethal
    max_roughness: 0.05   # variance above which a cell is lethal

    # --- step 9: GPU-accelerated fusion (see emap/fusion_gpu.py) ---
    # Same fusion math as step 4, run on the GPU via CuPy instead of NumPy.
    # Safe to leave true even without a GPU/cupy installed - the node
    # detects that at startup and silently falls back to the CPU path.
    use_gpu_fusion: true

    # --- step 10: vertical drift compensation (see emap/drift.py) ---
    enable_drift_compensation: true
    drift_confidence_variance_thresh: 0.05  # a cell below this variance counts as a trusted reference
    drift_min_matches: 30                    # minimum confident-cell matches before trusting an estimate
    drift_correction_gain: 0.3               # damping factor per update, not an instant full snap
    # A single callback's residual bigger than this is treated as an
    # untrustworthy sensor glitch (e.g. a depth-camera near-clip-plane
    # artifact), not real drift, and ignored - real pose drift accumulates
    # slowly, it doesn't jump by meters in one frame. Same "too big to
    # trust" principle as fuse_points' own outlier rejection.
    drift_max_reasonable_residual: 1.0
    # FAKE drift, for visibility only - real Gazebo TF never drifts on its
    # own (see docs/work-docs/emap/step10_drift_compensation.md), so this
    # adds an artificial, slowly-growing Z offset (meters/second) to
    # demonstrate the correction actually working live. Leave at 0.0 for
    # normal operation.
    synthetic_drift_z_rate: 0.0
